[build-system]
requires = ["hatchling<1.27"]
build-backend = "hatchling.build"

[project]
name = "young-stock-cli"
version = "0.3.16"
description = "Personal investing cockpit CLI for A/HK/US stocks, funds, evidence reports, and local workflows."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "AdvancingTitans" }]
keywords = ["stock", "a-share", "china", "finance", "cli", "eastmoney"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "requests>=2.31",
    "rich>=13.0",
    "click>=8.1",
    "prompt-toolkit>=3.0,<4",
]

[project.urls]
Homepage = "https://github.com/AdvancingTitans/young-stock-cli"
Repository = "https://github.com/AdvancingTitans/young-stock-cli"
Issues = "https://github.com/AdvancingTitans/young-stock-cli/issues"
Changelog = "https://github.com/AdvancingTitans/young-stock-cli/blob/main/CHANGELOG.md"

[project.scripts]
young = "young_stock.cli:cli"

[project.optional-dependencies]
pdf = ["weasyprint>=62"]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/young_stock"]

[tool.hatch.build]
include = [
    "src/young_stock/**/*.py",
    "src/young_stock/data/*.json",
    "src/young_stock/templates/*.html",
]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "F402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
markers = [
    "network: explicit live-network checks; excluded from ordinary CI unless requested",
]
