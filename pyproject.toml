[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "young-stock-cli"
version = "0.1.0"
description = "A-share/HK/US stock market CLI: no-login Eastmoney APIs, sector rankings, sentiment analysis"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "AdvancingTitans" }]
keywords = ["stock", "a-share", "eastmoney", "finance", "cli", "quant", "china-stock"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/AdvancingTitans/young-stock-cli"
Repository = "https://github.com/AdvancingTitans/young-stock-cli"
Issues = "https://github.com/AdvancingTitans/young-stock-cli/issues"
Changelog = "https://github.com/AdvancingTitans/young-stock-cli/blob/main/CHANGELOG.md"

[project.scripts]
young = "young_stock_cli.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/young_stock_cli"]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.pytest.ini_options]
testpaths = ["tests"]
